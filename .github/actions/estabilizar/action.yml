name: Completar, estabilizar y generar el maestro
description: Corre las etapas completar (opcional), estabilizar y maestro, exporta las hojas de revisión y sube el resultado a la rama actual.
inputs:
  completar:
    description: "true para regenerar antes la base desde la fuente de partida (06_completar_set.py)"
    required: false
    default: "false"
  forzar:
    description: "true para reemplazar el maestro aunque tenga correcciones a mano"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./pipeline/.github/actions/preparar
    - name: Proteger las correcciones a mano
      if: inputs.forzar != 'true'
      shell: bash
      run: |
        sfd=$(python3 -c "import sys; sys.path.insert(0,'pipeline/scripts'); import config as C; print(C.rel(C.SFD))")
        git fetch -q --unshallow 2>/dev/null || true
        manos=$(git log --format='%an' -- "$sfd" | grep -v 'github-actions' | head -1 || true)
        if [ -n "$manos" ]; then
          echo "::error::$sfd tiene commits hechos a mano ($manos): estabilizar lo reemplazaría y se perderían las correcciones. Usa las hojas (rama importar/…) o corre este workflow con forzar."
          exit 1
        fi
      if: inputs.completar == 'true'
      shell: bash
      run: python3 pipeline/scripts/06_completar_set.py
    - name: Altura de x y kerning
      shell: bash
      run: python3 pipeline/scripts/10_estabilizar.py
    - name: Maestro de FontForge y acentuadas como componentes
      shell: bash
      run: |
        python3 pipeline/scripts/07_a_sfd.py --estable --forzar
        python3 pipeline/scripts/03_limpiar.py --sin-limpiar
    - name: Hojas de revisión desde la fuente compilada
      shell: bash
      run: |
        python3 pipeline/scripts/04_build.py
        python3 pipeline/scripts/11_hojas.py exportar
    - name: Subir el resultado a la rama
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add sources/ hojas/
        git commit -m "Pipeline: base, altura de x, kerning, maestro y hojas de revisión (GitHub Actions)" || echo "sin cambios"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push
